# Seguridad y calidad en cada push y pull request (brief seguridad §B1 y §B2).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Gitleaks (secretos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Instalar y ejecutar gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner -v .

  quality:
    name: Auditoría, tipos, lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: npm audit (falla con vulnerabilidades altas o críticas)
        run: npm audit --audit-level=high --omit=dev
      - run: npm run typecheck
      - run: npx eslint src
      - run: npm test
      - name: Build (con valores de ejemplo, sin secretos reales)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_SITE_URL: https://example.com
          # Señuelos: si alguno aparece en el código del navegador, una clave secreta se ha filtrado.
          SUPABASE_SERVICE_ROLE_KEY: KZ_SENUELO_SUPABASE_SERVICE_ROLE_KEY
          TURNSTILE_SECRET_KEY: KZ_SENUELO_TURNSTILE_SECRET_KEY
          POSTHOG_PERSONAL_API_KEY: KZ_SENUELO_POSTHOG_PERSONAL_API_KEY
          USAGE_CHECK_KEY: KZ_SENUELO_USAGE_CHECK_KEY
          GITHUB_READ_TOKEN: KZ_SENUELO_GITHUB_READ_TOKEN
          SENTRY_AUTH_TOKEN: KZ_SENUELO_SENTRY_AUTH_TOKEN
          CF_ANALYTICS_TOKEN: KZ_SENUELO_CF_ANALYTICS_TOKEN
      - name: Revisión de seguridad del código público (secretos filtrados al navegador)
        run: node scripts/security-scan-build.mjs
