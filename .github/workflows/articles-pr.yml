# Propuestas de artículos del bot: valida, publica una vista previa privada y comenta el resumen.
# Aprobar = pulsar "Merge" en la propuesta (también desde la app de GitHub en el móvil).
name: Artículos (propuesta)

on:
  pull_request:
    paths:
      - 'content/articulos/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validar artículos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validación (datos, secciones, fuentes, URLs únicas)
        run: npm run validate:content

  preview:
    name: Vista previa y resumen
    needs: validate
    runs-on: ubuntu-latest
    env:
      # Los secretos no se pueden usar en 'if'; se exponen como indicador.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resumen de los artículos de la propuesta
        id: summary
        run: node scripts/articles-summary.mjs "origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
      - name: Vista previa en Cloudflare (solo si está configurado)
        id: preview
        if: ${{ env.HAS_CLOUDFLARE == 'true' }}
        # Si falla (p. ej. el Worker aún no se ha publicado nunca), se comenta igualmente con el motivo.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          set -o pipefail
          node scripts/build-content.mjs --drafts
          npx next build
          node scripts/patch-middleware-trace.mjs
          npx opennextjs-cloudflare build --skipNextBuild
          npx opennextjs-cloudflare upload --preview-alias "pr-${{ github.event.number }}" 2>&1 | tee upload.log
          echo "url=$(grep -oE 'https://pr-[^ ]+\.workers\.dev' upload.log | head -1)" >> "$GITHUB_OUTPUT"
      - name: Comentar en la propuesta
        uses: actions/github-script@v7
        env:
          SUMMARY: ${{ steps.summary.outputs.markdown }}
          PREVIEW: ${{ steps.preview.outputs.url }}
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
        with:
          script: |
            const body = [
              '### Artículos listos para revisar',
              process.env.SUMMARY || '(sin cambios en artículos)',
              process.env.PREVIEW
                ? `\n**Vista previa privada:** ${process.env.PREVIEW}`
                : process.env.PREVIEW_OUTCOME === 'failure'
                  ? '\n_Vista previa: no se pudo crear (Cloudflare solo crea vistas previas de un Worker ya publicado una vez; mira el registro del paso "Vista previa en Cloudflare")._'
                  : '\n_Vista previa: se activará al conectar Cloudflare (CLOUDFLARE_API_TOKEN)._',
              '\nSi todo está bien, pulsa **Merge** y se publica solo en unos minutos.',
            ].join('\n');
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
