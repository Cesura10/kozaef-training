# Publicación automática: cada cambio aprobado en main se compila y se despliega en Cloudflare,
# y se avisa a Bing (IndexNow). Los secretos de runtime viven en Cloudflare (wrangler secret put).
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Publicación programada: lunes y jueves a las 7:00 (Madrid, verano) salen los artículos
  # cuya fechaPublicacion ya ha llegado (scripts/build-content.mjs) y se avisa a IndexNow.
  schedule:
    - cron: '0 5 * * 1,4'

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
      NEXT_PUBLIC_PLATFORM_OPEN: ${{ vars.NEXT_PUBLIC_PLATFORM_OPEN }}
      NEXT_PUBLIC_AUTH_GOOGLE: ${{ vars.NEXT_PUBLIC_AUTH_GOOGLE }}
      NEXT_PUBLIC_AUTH_PASSWORD: ${{ vars.NEXT_PUBLIC_AUTH_PASSWORD }}
      NEXT_PUBLIC_ADS_ENABLED: ${{ vars.NEXT_PUBLIC_ADS_ENABLED }}
      # Las NEXT_PUBLIC_* se incrustan al compilar: si faltan aquí, en producción quedan apagadas.
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.NEXT_PUBLIC_CF_BEACON_TOKEN }}
      CSP_ENFORCE: ${{ vars.CSP_ENFORCE }}
      # La clave de IndexNow es pública (se sirve en /indexnow.txt): hace falta al compilar.
      INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Comprobar variables imprescindibles
        # Sin la URL real, canonical, sitemap y robots saldrían apuntando a localhost.
        run: |
          case "$NEXT_PUBLIC_SITE_URL" in
            https://*) ;;
            *) echo "::error::NEXT_PUBLIC_SITE_URL debe ser la URL pública https:// (ahora: '$NEXT_PUBLIC_SITE_URL')"; exit 1 ;;
          esac
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            [ -n "${!v}" ] || { echo "::error::Falta la variable $v"; exit 1; }
          done
      - run: npm ci
      - run: npm run validate:content
      - name: Compilar y desplegar en Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy
      - name: Revisión de seguridad de la web publicada
        run: sleep 20 && node scripts/security-check-prod.mjs
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      - name: Avisar a Bing (IndexNow)
        run: node scripts/indexnow.mjs

  # La web se sirve desde Netlify (bloqueos de LaLiga, 2026-10-18). Netlify publica solo cada cambio
  # en main; los lunes y jueves (y a mano) además se le pide una publicación para que salgan los
  # artículos programados cuya fecha ya ha llegado.
  netlify-programada:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Pedir a Netlify una publicación nueva
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          [ -n "$NETLIFY_BUILD_HOOK" ] || { echo "::warning::Falta el secreto NETLIFY_BUILD_HOOK"; exit 0; }
          curl -fsS -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
